---
applications:
  - name: runa-sap
    memory: 256M
    instances: 1
    buildpacks: [python_buildpack]
    command: uvicorn sap_mock:app --host 0.0.0.0 --port $PORT
    routes:
      - route: runa-sap-leiva230.cfapps.ap10.hana.ondemand.com
  - name: runa-bot
    memory: 256M
    instances: 1
    buildpacks: [python_buildpack]
    command: python bot.py
    no-route: true
    health-check-type: process
    env:
      SAP_BASE: https://runa-sap-leiva230.cfapps.ap10.hana.ondemand.com
      AI_PROVIDER: sapaicore
