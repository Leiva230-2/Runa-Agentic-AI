description: >-
  Answers questions about inbound deliveries and warehouse operations today:
  whether a delivery (DO) is late or early and its new arrival time, goods
  that arrived short or damaged, decisions waiting for a supervisor (for
  example a truck arriving after the dock closes), what drivers and warehouse
  staff reported in the operations group chat, and a summary of the day.
  Users ask in Indonesian or English, for example "Apa yang terjadi dengan
  DO 4521 hari ini?", "Bagaimana status pengiriman hari ini?" or "Is DO 4522
  late?".
target:
  name: ask_runa
  type: function
